name = "groq-proxy"
main = "worker.js"
compatibility_date = "2026-10-29"

# 保留在 Dashboard 手动设置的变量，避免每次部署被清空
keep_vars = true

# 部署后在 Dashboard → Settings → Variables and Secrets 里添加：
#   GROQ_API_KEY = gsk_你的 Groq Key（推荐填，真实 key 不暴露给客户端）
#   ACCESS_KEY   = 你自己设的网关密码（推荐填，防止被人白嫖）

[observability]
enabled = true
